[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matma-consumer-fixture"
version = "0.0.1"
description = "An isolated consumer for MATMA Python installation checks"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
